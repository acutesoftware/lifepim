{% extends "layout.html" %}
{% block module_content %}
  <div>
    <a href="{{ url_for('media.list_media_table_route', area=area) }}">Table</a> |
    <a href="{{ url_for('media.list_media_list_route', area=area) }}">List</a> |
    <a href="{{ url_for('media.list_media_grid_route', area=area) }}">Grid</a> |
    <a href="{{ url_for('media.import_media_route', area=area) }}">Add Media</a> |
    <a href="{{ url_for('media.media_player_route', area=area) }}" onclick="window.open(this.href, 'media_player', 'width=520,height=620,menubar=no,toolbar=no,location=no,status=no'); return false;">Player</a>
  </div>

  <div style="display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:8px;">
    {% for item in items %}
    <div style="border:1px solid #ccc; border-radius:6px; padding:6px;">
      <a href="{{ url_for('media.view_media_route', item_id=item.id, area=area) }}">
        {% if item.is_video %}
          <video muted style="max-width:100%; max-height:120px;">
            <source src="{{ item.media_url }}">
          </video>
        {% else %}
          <img src="{{ item.media_url }}" alt="{{ item.file_name }}" style="max-width:100%; max-height:120px;">
        {% endif %}
      </a>
      <div style="font-size:11px; color:#666;">{{ item.file_name }}</div>
      <div style="font-size:10px;">
        <a href="{{ url_for('media.media_player_route', area=area, id=item.id) }}" onclick="window.open(this.href, 'media_player', 'width=520,height=620,menubar=no,toolbar=no,location=no,status=no'); return false;">Play</a> |
        <a href="{{ url_for('media.edit_media_route', item_id=item.id, area=area) }}">Edit</a> |
        <a href="{{ url_for('media.delete_media_route', item_id=item.id, area=area) }}" onclick="return confirm('Delete item?');">Del</a>
      </div>
    </div>
    {% endfor %}
  </div>

  {% include "widgets/wid_pagination.html" %}
{% endblock %}
