<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifePIM Icon Picker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='lifepim.css', v=static_asset_version|default(0)) }}">
</head>
<body class="icon-picker-body" data-picker-target="{{ target }}" data-picker-mode="{{ mode }}">
  <main class="icon-picker-page">
    <header class="icon-picker-header">
      <div>
        <h1>Icon Picker</h1>
        <div class="icon-picker-selected" data-selected-icon>Pick one icon</div>
      </div>
      <input type="search" class="icon-picker-search" placeholder="Search emojis">
    </header>
    <nav class="icon-picker-tabs" data-icon-tabs aria-label="Emoji groups"></nav>
    <section class="icon-picker-grid" data-icon-grid aria-label="Emoji choices"></section>
  </main>
  <script src="{{ url_for('static', filename='icon_picker.js') }}"></script>
</body>
</html>
