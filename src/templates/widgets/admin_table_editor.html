<div class="admin-table-editor" data-editor="{{ editor_id }}">
  <div class="admin-editor-toolbar">
    <button type="button" data-editor-add>+ Add Row</button>
    <input type="search" data-editor-search placeholder="Search">
    <span class="admin-editor-status" data-editor-status></span>
  </div>
  <div class="tabular-scroll admin-table-editor-scroll">
    <table class="settings-table admin-editor-table">
      <thead data-editor-head></thead>
      <tbody data-editor-body></tbody>
    </table>
  </div>
</div>
